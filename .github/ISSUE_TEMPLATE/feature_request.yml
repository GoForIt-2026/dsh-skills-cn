name: 功能建议
description: 提一个功能或改进，比如新的分组方式、更多中文词条、交互优化
title: '[feat] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        功能建议请先说清「你现在怎么做这件事、卡在哪」，比描述实现方案更有用。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      placeholder: 每次找某个技能都要翻两页，而且英文名记不住…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么工作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代办法
      description: 比如用 `/` 菜单、别的插件、手动记名字。
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 边界确认
      description: 这个插件的定位是「看懂 + 叫得出」，写操作只有显式确认的删除。
      options:
        - label: 这个需求不要求插件修改技能内容或自动下载技能
          required: true
  - type: checkboxes
    id: pr
    attributes:
      label: 是否愿意提 PR
      options:
        - label: 我可以自己实现并提 PR（可以先在 issue 里对一下方案）
