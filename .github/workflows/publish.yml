name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Refuse unresolved repository placeholders
        run: |
          if grep -R "YOUR_GITHUB" package.json README.md README.en.md CHANGELOG.md LICENSE; then
            echo "Replace YOUR_GITHUB before publishing." >&2
            exit 1
          fi
      - name: Validate manifest and resources
        run: npm test
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
